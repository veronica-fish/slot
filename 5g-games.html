    <style>
        /* CSS Khusus Halaman Game 5G Games */
        body { background-color: #051009; background-image: none; padding-top: 75px; padding-bottom: 70px; }
        
        /* Header */
        .top-header {
            position: fixed; top: 0; left: 0; width: 100%; display: flex; justify-content: center;
            align-items: center; padding: 0; background-color: #000000; height: 75px;
            border-bottom: 1px solid #333; z-index: 1000;
        }
        .logo-area img { height: 50px; width: auto; max-width: 200px; object-fit: contain; display: block; }
        .menu-btn {
            position: absolute; right: 15px; background-color: #1a1a1a; padding: 8px 12px;
            border-radius: 5px; cursor: pointer; color: #FFD700; z-index: 10;
        }

        /* Judul Halaman */
        .page-title {
            text-align: center; color: #FFD700; font-size: 18px; font-weight: bold;
            padding: 15px 0; border-bottom: 1px solid #333; text-transform: uppercase;
        }

        /* Grid Game */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 Kolom */
            gap: 10px;
            padding: 15px;
            margin-bottom: 80px;
        }

        .game-card {
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 1px solid #333;
            transition: transform 0.2s, border-color 0.2s;
            aspect-ratio: 3 / 4; 
        }

        .game-card:active { transform: scale(0.95); border-color: #FFD700; }

        .game-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Tombol Scroll Ke Atas */
        .scroll-top-btn {
            position: fixed; bottom: 80px; right: 15px; width: 45px; height: 45px;
            background-color: rgba(100, 100, 100, 0.8); color: white; border-radius: 8px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 11px; cursor: pointer; z-index: 99; border: 1px solid #777;
        }
        .scroll-top-btn i { font-size: 16px; margin-bottom: 2px; }
    </style>
</head>
